name: Manter API do Render ativa

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Acordar e verificar a API
        env:
          HEALTH_URL: https://portal-all.onrender.com/api/health
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --max-time 90 \
            --retry 2 \
            --retry-delay 10 \
            --retry-all-errors \
            "$HEALTH_URL"
